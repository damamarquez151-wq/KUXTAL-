<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prueba formulario - Lili</title>
</head>
<body style="font-family: sans-serif; max-width: 600px; margin: 20px auto;">
  <h1>Daily check-in (test)</h1>

  <p>Blood pressure: <input id="presion_sistolica" type="number" step="any" placeholder="120">
     / <input id="presion_diastolica" type="number" step="any" placeholder="80"> mmHg</p>
  <p>Heart rate: <input id="frecuencia_cardiaca" type="number" step="any"> bpm</p>
  <p>Temperature: <input id="temperatura" type="number" step="any"> °C</p>
  <p>Blood sugar: <input id="glucosa" type="number" step="any"> mg/dL</p>
  <p>Sleep: <input id="sueno" type="number" step="any"> hours</p>
  <p>Mood (1-5): <input id="animo" type="number" min="1" max="5"></p>

  <button id="btn-evaluar">Evaluate</button>

  <div id="resultados"></div>
    <h2>Trends</h2>
  <select id="indicador-grafica"></select>
  <canvas id="grafica-tendencia" height="140"></canvas>

    <script src="js/chart.umd.js"></script>
  <script src="js/reglas.js"></script>
  <script src="js/app.js"></script>
  <script src="js/graficas.js"></script>
</body>
</html>
